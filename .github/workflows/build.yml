name: Build LineageOS recovery mcv1s
on:
  workflow_dispatch:
  push:
    branches: [lineageos]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h
      - name: Build
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/kit" -w /kit ubuntu:18.04 bash build.sh 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        run: python3 ci_errors.py build.log
      - uses: actions/upload-artifact@v4
        with:
          name: lineage-recovery-mcv1s-UNTESTED
          path: lineage-recovery-mcv1s-UNTESTED.img
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
